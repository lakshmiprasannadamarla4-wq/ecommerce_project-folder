<!DOCTYPE html>
<html>
<head>
<title>MyShop - E-Commerce</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
header{background:#232f3e;color:white;padding:15px;display:flex;justify-content:space-between}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;padding:20px}
.card{background:white;padding:10px;border-radius:8px;text-align:center}
.card img{width:100%;height:180px;object-fit:cover;border-radius:8px}
button{background:#ff9900;border:none;padding:8px 15px;border-radius:5px;cursor:pointer;font-weight:bold}
#cart{position:fixed;right:20px;top:70px;background:white;padding:15px;border-radius:8px;width:250px;box-shadow:0 0 10px #aaa}
</style>
</head>
<body>
<header><h2>🛒 MyShop E-Commerce</h2><div><button onclick="login()">Login</button> <span id="cartCount">Cart: 0</span></div></header>
<div class="products" id="products"></div>
<div id="cart"><h3>Cart</h3><div id="cartItems"></div><button onclick="checkout()">Checkout</button><h4>Order Tracking</h4><input id="orderId" placeholder="Enter Order ID"><button onclick="track()">Track</button><p id="trackResult"></p></div>

<script>
let cart=[];
async function load(){
  let res=await fetch('/api/products');
  let data=await res.json();
  document.getElementById('products').innerHTML=data.map(p=>`
    <div class="card"><img src="${p.image}"><h3>${p.name}</h3><p>Rs.${p.price} | ${p.category}</p><p>Stock: ${p.stock}</p><button onclick="addToCart(${p.id},'${p.name}',${p.price})">Add to Cart</button></div>
  `).join('');
}
function addToCart(id,name,price){cart.push({name,price});document.getElementById('cartCount').innerText='Cart: '+cart.length;document.getElementById('cartItems').innerHTML=cart.map(c=>`<p>${c.name} - Rs.${c.price}</p>`).join('');}
async function checkout(){
  if(cart.length==0) return alert('Cart empty');
  let total=cart.reduce((s,c)=>s+c.price,0);
  let res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:'user',product:cart.map(c=>c.name).join(','),qty:cart.length,total:total})});
  let d=await res.json(); alert('Order Placed! Order ID: '+d.order_id); cart=[];
}
function login(){let u=prompt('Username: admin/user');let p=prompt('Password: admin123/user123');fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}).then(r=>r.json()).then(d=>alert(d.message||d.error+' Role: '+d.role));}
async function track(){let id=document.getElementById('orderId').value;let res=await fetch('/api/orders');let orders=await res.json();let o=orders.find(x=>x.id==id);document.getElementById('trackResult').innerText=o?`Order ${o.id}: ${o.status} - ${o.product}`:'Not Found';}
load();
</script>
</body>
</html>
